name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'        # daily
  workflow_dispatch:           # allow manual runs

permissions:
  contents: write              # allow pushing to branches

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: DineshDhanoki
          # output_path placed at repo root (temporary in runner)
          output_path: github-contribution-grid-snake-dark.svg

      - name: Show generated file
        run: ls -la github-contribution-grid-snake-dark.svg || true

      - name: Commit & push SVG to 'output' branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # If 'output' exists, fetch it; else create orphan branch
          if git ls-remote --exit-code --heads origin output; then
            git fetch origin output:output
            git checkout output
          else
            git checkout --orphan output
          fi

          # remove everything in this branch (we only want the svg)
          git rm -rf . || true

          # move the generated svg to the working dir (if exists)
          if [ -f github-contribution-grid-snake-dark.svg ]; then
            mv github-contribution-grid-snake-dark.svg ./github-contribution-grid-snake-dark.svg
            git add github-contribution-grid-snake-dark.svg
            git commit -m "chore: update contribution snake [ci skip]" || true
            git push -f origin HEAD:output
          else
            echo "SVG not found - generation failed"
            exit 1
          fi
