name: Generate Contribution Snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"  # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write         # Needed to push to the output branch

jobs:
  build:
    name: Generate Snake Animation
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: DineshDhanoki
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 🚀 Push snake animation to output branch
        run: |
          mkdir -p output
          cp dist/github-contribution-grid-snake-dark.svg output/github-contribution-grid-snake-dark.svg
          cd output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update contribution snake 🐍"
          git branch -M output
          git push -f https://github.com/${{ github.repository }} output
